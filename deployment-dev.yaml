apiVersion: apps/v1
kind: Deployment
metadata:
  name: minterjt-dev-deployment
spec:
  replicas: 2  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: minterjt-nginx
  template:
    metadata:
      labels:
        app: minterjt-nginx
    spec:
      containers:
      - name: nginx
        image: cithit/minterjt:latest
        ports:
        - containerPort: 80  # Expose NGINX on port 80

---
  apiVersion: v1
  kind: Service
  metadata:
    name: minterjt-dev-service
  spec:
    selector:
      app: minterjt-nginx
    type: NodePort
    ports:
      - protocol: TCP
        port: 80
        targetPort: 80
        nodePort: 32000
